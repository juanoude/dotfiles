# AeroSpace configuration. alt means the macOS Option key.
# Reference: https://nikitabobko.github.io/AeroSpace/guide
config-version = 2
start-at-login = true
auto-reload-config = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']
key-mapping.preset = 'qwerty'

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.top = 8
outer.bottom = 8

[mode.main.binding]
# Wait for Option release before sending Spotlight's native Command + Space.
alt-space = 'exec-and-forget osascript -l JavaScript /Users/juanananda/.config/aerospace/open-spotlight.js'
alt-enter = 'exec-and-forget osascript /Users/juanananda/.config/aerospace/open-ghostty-window.applescript'
alt-backtick = 'close'
# Leave Option + W/Q to the ABNT2 layout (? and /).
# Command + W/Q retain the focused application's normal behavior.

# Focus windows using Vim keys or arrow keys.
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'

# Add Shift to move the focused window.
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'
alt-shift-left = 'move left'
alt-shift-down = 'move down'
alt-shift-up = 'move up'
alt-shift-right = 'move right'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-f = 'fullscreen'
alt-shift-space = 'layout floating tiling'
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'
alt-shift-b = 'balance-sizes'
alt-shift-r = 'reload-config'

# Pause/resume window management from any workspace.
alt-shift-p = 'enable toggle'
